name: Petrocrib Admin CI

on:
  push:
    branches: [feature/petrocrib-admin-backend]
    paths:
      - 'admin-app/**'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    paths:
      - 'admin-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-app/package.json
      - run: npm install
      - run: npm run build
